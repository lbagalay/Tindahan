<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · Tindahan</title>
<style>
  html, body { margin: 0; height: 100%; background: #f6efe0; color: #241c10; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { min-height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
  .card { max-width: 380px; }
  .badge { width: 56px; height: 56px; border-radius: 16px; background: #176b4d; display: grid; place-items: center; margin: 0 auto 20px; color: #fff; font-weight: 800; font-size: 22px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.6; color: #55492f; margin: 0 0 20px; }
  button { height: 44px; padding: 0 20px; border-radius: 10px; border: none; background: #176b4d; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
  button:hover { background: #0e5038; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="badge">₱</div>
      <h1>You're offline</h1>
      <p>This page hasn't been loaded before, so there's nothing cached to show. If you were mid-sale on the Counter, don't worry — sales already in progress there are saved on this device and will sync once you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </div>
</body>
</html>
